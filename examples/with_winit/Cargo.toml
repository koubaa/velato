[package]
name = "with_winit"
version = "0.0.0"
description = "An example using Vello with Velato to render to a winit window"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "with_winit"
crate-type = ["cdylib", "lib"]

[[bin]]
# Stop the PDB collision warning on windows
name = "with_winit_bin"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["use_vello"]
use_vello = ["dep:vello", "dep:wgpu", "scenes/use_vello"]
use_ekrano = ["dep:ekrano", "dep:goldy", "scenes/use_ekrano"]

[dependencies]
vello = { workspace = true, features = ["wgpu"], optional = true }
ekrano = { workspace = true, optional = true }
goldy = { workspace = true, optional = true }
kurbo = { workspace = true }
peniko = { workspace = true }
wgpu = { version = "27.0", features = ["vulkan", "metal", "dx12"], optional = true }
scenes = { path = "../scenes", default-features = false }
anyhow = "1"
clap = { version = "4.5.38", features = ["derive"] }
instant = { version = "0.1.13", features = ["wasm-bindgen"] }
pollster = "0.3"
winit = "0.29.15"
env_logger = "0.11.8"
log = "0.4.27"
# When the ekrano path is active, goldy's diagnostics use the `tracing` crate;
# without this subscriber, the only thing that reaches stderr on a GPU error is
# the short `anyhow::bail!` string — the richer `localizedDescription` from
# Metal's completion handler is silently dropped. The subscriber reads the same
# `RUST_LOG` filter as env_logger so existing invocations keep working.
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = { version = "0.2" }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
vello = { workspace = true, features = ["hot_reload", "wgpu"], optional = true }
notify-debouncer-mini = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.29.15", features = ["android-native-activity"] }
android_logger = "0.13.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = ["HtmlCollection", "Text"] }
getrandom = { version = "0.2.16", features = ["js"] }
