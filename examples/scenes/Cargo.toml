[package]
name = "scenes"
description = "Velato scenes used in the other examples."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["use_vello"]
use_vello = ["dep:vello", "velato/vello"]
ekrano_backend = ["dep:ekrano", "velato/ekrano"]
use_ekrano = [
    "ekrano_backend",
    "ekrano/goldy-default",
    "ekrano/goldy-webgpu",
    "ekrano/goldy-cuda",
]

[dependencies]
vello = { workspace = true, optional = true }
ekrano = { workspace = true, optional = true }
kurbo = { workspace = true }
peniko = { workspace = true }
velato = { path = "../..", default-features = false }
anyhow = "1"
clap = { version = "4.5.38", features = ["derive"] }
image = { workspace = true, features = ["jpeg"] }
rand = "0.9.4"
skrifa = { workspace = true, features = ["std"] }
instant = "0.1"
bytemuck = { workspace = true }

# Used for the `download` command
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
byte-unit = "4.0.19"
inquire = "0.7"
ureq = "2.12.1"

[target.wasm32-unknown-unknown.dependencies]
# We have a transitive dependency on getrandom and it does not automatically
# support wasm32-unknown-unknown. We need to enable the js feature.
getrandom = { version = "0.2.16", features = ["js"] }
